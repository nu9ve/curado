[package]
name = "nu9ve-loudness"
description = "ITU-R BS.1770 loudness (integrated, momentary and short-term maximum, EBU Tech 3342 range) and a 4x true-peak detector"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "UNLICENSED"
publish = false

# Sin dependencias: el cálculo es aritmética de f64 y f32 de la biblioteca estándar.
[dependencies]

[dev-dependencies]
# Sólo para leer data/audio/loudness-vectors-v1.json en las pruebas. La misma que nu9ve-json.
serde_json = "1.0.154"
# sha256 de cada PCM dorado antes de medirlo, para no medir un archivo cambiado. RustCrypto, MIT o Apache-2.0.
sha2 = "0.10.9"

[lints.rust]
# Sin unsafe en el crate; sólo el asignador que cuenta de tests/no_allocation.rs lo permite.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
