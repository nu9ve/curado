[package]
name = "nu9ve-music"
description = "Offline musical analysis: beat grid (BPM, offset, downbeat), tempo map and key"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[dependencies]
# MusicAnalysis and MusicalKey are stored by apps (library caches) as JSON.
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
# Reads data/music/music-vectors-v1.json in tests/vectors.rs.
serde_json = "=1.0.154"

[lints.clippy]
all = { level = "deny", priority = -1 }
