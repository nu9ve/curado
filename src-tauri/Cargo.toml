[package]
name = "curado"
version = "0.1.0"
edition = "2021"
default-run = "curado"

[lib]
name = "curado_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
curado-audio = { path = "../crates/audio-engine" }
# Reading controllers: messages, detection and presets (docs/MIDI.md).
curado-midi = { path = "../crates/midi" }
# Durable atomic writes from the pinned nu9ve-fs-v1 crate (ADR-035).
nu9ve-fs = { path = "../vendor/nu9ve-core/rust/nu9ve-fs" }
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
sha2 = "0.10"
midir = "0.10"
crossbeam-queue = "0.3"

# Supervises the stem separation process group (macOS and Linux; the crate is empty on Windows).
[target.'cfg(unix)'.dependencies]
nu9ve-jobs = { path = "../vendor/nu9ve-core/rust/nu9ve-jobs" }

# Free space and volume serials (identity.rs). Already in Cargo.lock through Tauri/CPAL.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
