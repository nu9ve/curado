[package]
name = "curado-midi"
version = "0.1.0"
edition = "2021"

# Shared MIDI decoding and curado-specific presets. See docs/MIDI.md.
[dependencies]
nu9ve-midi = { path = "../../vendor/nu9ve-core/rust/nu9ve-midi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the probe opens ports; the app keeps opening them in src-tauri.
[dev-dependencies]
midir = "0.10"
